<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lemmata: equations</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      #equations { font-family: Lemmata, serif; font-size: 24px; }
      /* Not `display: block`: that replaces the `block math` the user agent
         stylesheet gives a `math[display="block"]`, and every token inside is
         then laid out on a line of its own with no mrow to run. The attribute
         on each `math` element is what puts it on its own line. */
      #equations math { margin: 0.5rem 0; }
    </style>
  </head>
  <body>
    <h1>Equations</h1>
    <p id="status">Loading.</p>
    <div id="equations"></div>
    <script type="module" src="./math.js"></script>
  </body>
</html>
