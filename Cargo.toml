[workspace]
members = ["crates/*"]
exclude = ["vendor"]
package.authors = []
package.categories = []
package.description = ""
package.edition = "2024"
package.keywords = []
package.license = "MIT OR Apache-2.0"
package.repository = "https://github.com/lemueldls/lemmata"
package.version = "0.1.0"
resolver = "3"

[workspace.dependencies]
facet = "=0.50.0-rc.7"
facet-toml = "=0.50.0-rc.7"
figue = "=5.0.0-rc.6"
kurbo = { version = "0.13.1", default-features = false, features = ["libm", "serde"] }
libm = "=0.2.16"
linesweeper = "0.5.0"
picante = "=3.0.0-rc.5"
read-fonts = "0.45.1"
rediff = "=0.50.0-rc.7"
sha2 = "0.10.9"
skrifa = "0.48.0"
write-fonts = "0.54.1"
wasm-bindgen = "=0.2.129"

# The vendored kurbo treats its `libm` feature as implying `no_std`, which is
# what makes it use one float implementation on every target instead of the
# platform's. Its `std` feature stays on because write-fonts enables it, and
# that is fine: the point is that `libm` now wins. docs/wasm-smoke.md has the
# upstream note that would retire this patch.
# The browser compresses one too, so brotli's portable float path is on: the
# default uses the platform's arithmetic and the bytes would differ across
# targets, which is the same trap the font bytes were caught by.
ttf2woff2 = { version = "0.14.0", default-features = false, features = ["portable-float"] }


harfrust = "0.14.0"

[patch.crates-io]
kurbo = { path = "vendor/kurbo" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# nursery
option_if_let_else = "allow"
use_self = "allow"

# pedantic
format_push_string = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_closure_for_method_calls = "allow"
too_many_lines = "allow"
used_underscore_items = "allow"

[workspace.lints.cargo]
unused_workspace_dependencies = "allow"
unused_workspace_package_fields = "allow"
