[workspace]
members = ["crates/*"]
exclude = ["vendor"]
package.authors = []
package.categories = []
package.description = ""
package.edition = "2024"
package.keywords = []
package.license = "MIT OR Apache-2.0"
package.repository = "https://github.com/lemueldls/lemmata"
package.version = "0.1.0"
resolver = "3"

[workspace.dependencies]
facet = "=0.50.0-rc.7"
facet-toml = "=0.50.0-rc.7"
figue = "=5.0.0-rc.6"
# kurbo computes with the platform's float math, and the host and wasm32
# disagree in the last bit. Its `libm` feature would put both on one
# implementation, but it is ignored while kurbo's `std` feature is on, and
# third-party crates in this graph enable it. See docs/wasm-smoke.md.
kurbo = "0.13.1"
libm = "=0.2.16"
linesweeper = "0.5.0"
picante = "=3.0.0-rc.5"
read-fonts = "0.45.1"
rediff = "=0.50.0-rc.7"
skrifa = "0.48.0"
write-fonts = "0.54.1"
vox = "=0.10.0-rc.7"
wasm-bindgen = "=0.2.129"
vox-schema = "=0.10.0-rc.7"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# nursery
option_if_let_else = "allow"
use_self = "allow"

# pedantic
format_push_string = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_closure_for_method_calls = "allow"
too_many_lines = "allow"
used_underscore_items = "allow"

[workspace.lints.cargo]
unused_workspace_dependencies = "allow"
unused_workspace_package_fields = "allow"
