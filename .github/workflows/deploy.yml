name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch the tree
        uses: actions/checkout@v7
        with:
          # The glyph source reads vendor/Iosevka/params at compile time.
          submodules: recursive
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sccache
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache the package store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Build the worker
        run: |
          nix develop --command bash -c '
            set -euo pipefail

            # The site package is a workspace dependency, so it has to exist
            # before pnpm install resolves the workspace.
            wasm-pack build crates/lemmata-web --target web \
              --out-dir ../../web/pkg

            pnpm install --frozen-lockfile
            pnpm --dir web build:workers
          '

      - name: Verify the deploy bundle
        if: github.event_name == 'pull_request'
        run: |
          nix develop --command pnpm --dir web exec wrangler \
            deploy --dry-run

      - name: Deploy
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          nix develop --command pnpm --dir web exec wrangler deploy
