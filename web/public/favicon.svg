<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Lemmata</title>
  <!-- The paper tile and ink border hold the mark on both light and dark tab
       strips. The dots stay ink, so the A1 triangle is legible at 16 px. -->
  <rect width="48" height="48" rx="10" fill="#f2efe4" stroke="#161811" stroke-width="2" />
  <g fill="#161811">
    <rect x="18" y="8" width="12" height="12" rx="1.4" />
    <rect x="8" y="28" width="12" height="12" rx="1.4" />
    <rect x="28" y="28" width="12" height="12" rx="1.4" />
  </g>
</svg>
