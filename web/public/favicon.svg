<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Lemmata</title>
  <style>
    /* One green for both, because the tile is what changes: a tab strip is a
       dark place in most browsers and a light one in some. */
    rect.tile { fill: #0a0b0d; }
    rect.dot { fill: #3e9e5c; }
    @media (prefers-color-scheme: light) {
      rect.tile { fill: #faf8f4; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7" />
  <g class="dot">
    <rect x="11.5" y="3" width="9" height="9" />
    <rect x="3" y="20" width="9" height="9" />
    <rect x="20" y="20" width="9" height="9" />
  </g>
</svg>
