<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Lemmata</title>
  <style>
    /* A tab strip is a dark place in most browsers and a light one in some. */
    rect.tile { fill: #0b0c0f; }
    rect.dot { fill: #86d98f; }
    @media (prefers-color-scheme: light) {
      rect.tile { fill: #f7f7f5; }
      rect.dot { fill: #1f7a3d; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7" />
  <g class="dot">
    <rect x="11.5" y="3" width="9" height="9" />
    <rect x="3" y="20" width="9" height="9" />
    <rect x="20" y="20" width="9" height="9" />
  </g>
</svg>
