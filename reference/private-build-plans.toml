[buildPlans.RefA]
family = "Lemmata Ref A"
spacing = "normal"
serifs = "sans"
exportGlyphNames = true

[buildPlans.RefA.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.RefA.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.RefB]
family = "Lemmata Ref B"
spacing = "normal"
serifs = "slab"
exportGlyphNames = true

[buildPlans.RefB.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.RefB.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"
[buildPlans.RefA.slopes.Italic]
angle = 15
shape = "oblique"
menu = "italic"
css = "italic"


# The same shape as RefA, with the default ligation set assigned to `calt`.
# The capture the ligature work reads was built from this plan.
[buildPlans.RefLig]
family = "Lemmata Ref Lig"
spacing = "normal"
serifs = "sans"
exportGlyphNames = true

[buildPlans.RefLig.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.RefLig.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.RefLig.ligations]
inherits = "default-calt"
